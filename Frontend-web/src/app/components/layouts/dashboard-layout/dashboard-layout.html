<main class="min-h-dvh bg-paper p-3 sm:p-6">
  <router-outlet />
</main>

@if (auth.loginPrompt(); as prompt) {
  <div class="modal-backdrop" [class.is-closing]="auth.loginPromptClosing()" role="dialog" aria-modal="true">
    <section class="modal-panel w-full max-w-[380px] rounded-[8px] bg-white p-6 text-center shadow-2xl">
      <h2 class="font-display text-[20px] font-extrabold text-[#5c1e2f]">Login obrigatório</h2>
      <p class="mt-3 text-[13px] leading-6 text-[#5f575b]">
        É obrigatório fazer login para {{ prompt.operation }}.
      </p>
      <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-center">
        <a routerLink="/auth/login" class="inline-flex h-10 items-center justify-center rounded-[6px] bg-[#5c1e2f] px-5 text-[12px] font-bold text-white" (click)="auth.closeLoginPrompt()">Entrar</a>
        <button type="button" class="inline-flex h-10 items-center justify-center rounded-[6px] border border-[#d8cbd0] px-5 text-[12px] font-bold text-[#5c1e2f]" (click)="auth.closeLoginPrompt()">Agora não</button>
      </div>
    </section>
  </div>
}
