<article class="stats-card">
  <h2>Estatísticas Totais</h2>
  <dl>
    <div>
      <dt>Horas de Estudo</dt>
      <dd>{{ stats().studyHours }}H</dd>
    </div>
    <div>
      <dt>Cursos Concluídos</dt>
      <dd>{{ stats().completedCourses }}</dd>
    </div>
    <div>
      <dt>Publicações no Fórum</dt>
      <dd>{{ stats().forumPosts }}</dd>
    </div>
    <div>
      <dt>Quizzes Concluídos</dt>
      <dd>{{ stats().completedQuizzes }}</dd>
    </div>
  </dl>
</article>
