<app-admin-console-shell activeItem="reports">
  <section class="grid gap-8">
    <header class="rounded-[22px] bg-[#f8f2ef] p-8 text-[#5c1e2f] shadow-sm">
      <p class="text-[10px] uppercase tracking-[0.24em] text-[#8a8587]">Relatórios</p>
      <h1 class="mt-4 text-[34px] font-extrabold">Monitoramento e Denúncias</h1>
      <p class="mt-3 max-w-2xl text-[14px] leading-7 text-[#534345]">
        Revise alertas, demandas e denúncias para garantir a qualidade e a conformidade do conteúdo na plataforma.
      </p>
    </header>

    <div class="grid gap-4">
      <article class="rounded-[22px] border border-[#e8dde0] bg-white p-6 shadow-sm">
        <p class="text-[13px] font-semibold text-[#2c2729]">Nenhum relatório novo</p>
        <p class="mt-3 text-[13px] text-[#6f686b]">
          Os relatórios serão exibidos aqui assim que forem gerados pelos utilizadores.
        </p>
      </article>
    </div>
  </section>
</app-admin-console-shell>
