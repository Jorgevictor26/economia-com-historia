<article class="learning-card">
  <img [src]="learning().imageUrl" [alt]="learning().title" />
  <div>
    <span>Continuar Aprendizagem</span>
    <h2>{{ learning().title }}</h2>
    <p>{{ learning().subtitle }}</p>
    <div class="progress">
      <span [style.width.%]="learning().progress"></span>
    </div>
    <button type="button">Retomar Aula →</button>
  </div>
</article>
