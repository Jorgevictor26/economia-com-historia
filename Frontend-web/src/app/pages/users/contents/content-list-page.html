<section class="-m-6 min-h-dvh bg-[#f7f8f8] text-[#2c2729]">
  <app-public-navbar />

  <main class="fluid-container pb-14 pt-6">
    <section class="mb-8">
      <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_310px] lg:items-end">
        <div>
          <h1 class="mt-3 font-display text-[32px] font-extrabold leading-tight text-[#640926]">Explorar
            Conte&uacute;dos</h1>
        </div>
      </div>

      <div
        class="mt-7 grid gap-4 rounded-[12px] border border-[#ddd8da] bg-white p-3 md:grid-cols-[minmax(0,1.7fr)_minmax(190px,0.85fr)_minmax(190px,0.85fr)]">
        <!-- Pesquisa -->
        <label
          class="flex min-h-[40px] items-center gap-2 rounded-[8px] bg-[#f1f1f3] px-3 text-[#89909d] cursor-pointer">
          <span class="material-symbols-outlined text-[#40081a]">search</span>
          <input
            class="w-full bg-transparent text-[13px] text-[#3b3437] outline-none placeholder:text-[#7d8490] cursor-pointer"
            type="text" placeholder="Pesquisar conteúdos..." [value]="searchTerm()" (input)="updateSearch($event)" />
          <!-- Ícone de limpar único -->
          @if (searchTerm()) {
          <button type="button" class="ml-2 text-[#40081a] hover:text-[#8a4055] cursor-pointer" (click)="clearSearch()">
            <span class="material-symbols-outlined">close</span>
          </button>
          }
        </label>

        <!-- Categoria -->
        <label class="relative flex min-h-[40px] items-center gap-2 rounded-[8px] bg-[#f1f1f3] px-3 cursor-pointer">
          <span class="material-symbols-outlined text-[#40081a]">category</span>
          <select
            class="h-full w-full appearance-none rounded-[8px] bg-transparent px-2 pr-8 text-[13px] font-semibold text-[#121212] outline-none cursor-pointer"
            [value]="selectedCategoryFilter()" (change)="selectCategoryFilter($any($event.target).value)">
            @for (filter of categoryFilters(); track filter) {
            <option [value]="filter">{{ filter === 'Todos' ? 'Todas as categorias' : filter }}</option>
            }
          </select>
          <!-- Ícone dropdown -->
          <span class="pointer-events-none absolute right-3 text-[#40081a]">
            <span class="material-symbols-outlined">arrow_drop_down</span>
          </span>
        </label>

        <!-- Tipo de conteúdo -->
        <label class="relative flex min-h-[40px] items-center gap-2 rounded-[8px] bg-[#f1f1f3] px-3 cursor-pointer">
          <span class="material-symbols-outlined text-[#40081a]">video_library</span>
          <select
            class="h-full w-full appearance-none rounded-[8px] bg-transparent px-2 pr-8 text-[13px] font-semibold text-[#121212] outline-none cursor-pointer"
            [value]="selectedContentTypeFilter()" (change)="selectContentTypeFilter($any($event.target).value)">
            @for (filter of contentTypeFilters(); track filter) {
            <option [value]="filter">{{ filter === 'Todos os formatos' ? 'Todos os tipos' : filter }}</option>
            }
          </select>
          <!-- Ícone dropdown -->
          <span class="pointer-events-none absolute right-3 text-[#40081a]">
            <span class="material-symbols-outlined">arrow_drop_down</span>
          </span>
        </label>
      </div>


    </section>

    @if (filteredContents().length === 0) {
    <section class="rounded-[8px] border border-[#e3d4d8] bg-white px-6 py-12 text-center">
      <h2 class="font-display text-[22px] font-extrabold text-[#5c1e2f]">Conte&uacute;do n&atilde;o encontrado</h2>
      <p class="mx-auto mt-3 max-w-[460px] text-[13px] leading-6 text-[#6f686b]">N&atilde;o encontramos conte&uacute;dos
        para a pesquisa ou filtro aplicado.</p>
    </section>
    }
    <div class="grid items-stretch gap-8 md:grid-cols-2 xl:grid-cols-3">
      @for (content of filteredContents(); track content.id) {
      <app-content-card [content]="content" [canReadPremium]="auth.canReadJindungo()"
        (gatedAction)="requireLogin($event.event, $event.operation)" />
      }
    </div>

    <div class="mt-8 flex flex-col items-center gap-2">
      <div
        class="inline-grid min-h-[18px] overflow-hidden rounded-full border border-[#d8d3d6] bg-white shadow-[0_8px_18px_rgba(64,8,26,0.06)] sm:grid-cols-[120px_50px_120px]">
        <!-- Botão anterior -->
        <button type="button"
          class="flex items-center justify-center gap-1 px-3 text-[13px] font-semibold text-[#40081a] transition hover:bg-[#fff6f8] disabled:cursor-not-allowed disabled:text-[#c7bdc1]"
          [disabled]="!hasPreviousPage() || isLoadingContents()" (click)="goToPreviousPage()">
          <span class="text-[16px] leading-none" aria-hidden="true">&larr;</span>
          Anterior
        </button>

        <!-- Página atual -->
        <div class="grid place-items-center border-x border-[#d8d3d6] px-2">
          <span class="grid size-8 place-items-center rounded-[8px] bg-[#6b3344] text-[14px] font-bold text-white">
            {{ pagination().currentPage }}
          </span>
        </div>

        <!-- Botão próximo -->
        <button type="button"
          class="flex items-center justify-center gap-1 px-3 text-[13px] font-semibold text-[#40081a] transition hover:bg-[#fff6f8] disabled:cursor-not-allowed disabled:text-[#c7bdc1]"
          [disabled]="!hasMoreContents() || isLoadingContents()" (click)="goToNextPage()">
          Próximo
          <span class="text-[16px] leading-none" aria-hidden="true">&rarr;</span>
        </button>
      </div>
    </div>


  </main>

  <app-public-footer />
  <app-back-to-top />
</section>
