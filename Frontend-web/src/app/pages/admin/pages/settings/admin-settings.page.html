<app-admin-console-shell activeItem="settings">
  <section class="mx-auto grid max-w-6xl gap-5">
    <app-admin-page-header title="Preferências da Plataforma" eyebrow="Configurações">
      <button type="button" (click)="saveSettings()" class="inline-flex h-10 items-center justify-center gap-2 rounded-[6px] bg-[#5c1e2f] px-4 text-[12px] font-extrabold text-white shadow-[0_10px_24px_rgba(92,30,47,0.16)] transition hover:bg-[#8A3F50]">
        <span class="material-symbols-outlined text-[16px]" aria-hidden="true">save</span>
        Guardar alterações
      </button>
    </app-admin-page-header>

    @if (saveStatus) {
      <p class="rounded-[8px] border border-[#E8D5DB] bg-[#F2E6E9] px-4 py-3 text-[12px] font-extrabold text-[#5C1E2F]">{{ saveStatus }}</p>
    }

    <div class="grid gap-5 xl:grid-cols-2">
      <article class="rounded-[8px] border border-[#E0E0E0] bg-white p-5 shadow-[0_18px_45px_rgba(27,22,30,0.05)]">
        <h2 class="text-[18px] font-extrabold text-[#5C1E2F]">Segurança e acesso</h2>
        <p class="mt-2 text-[12px] leading-5 text-[#616161]">
          Gerencie permissões de administradores, restrições de login e políticas de sessão.
        </p>

        <div class="mt-5 grid gap-4">
          <label class="grid gap-2">
            <span class="text-[12px] font-semibold text-[#616161]">Acesso administrativo</span>
            <select class="h-11 rounded-[6px] border border-[#E0E0E0] px-4 text-[14px] outline-none focus:border-[#8A3F50]">
              <option>Permitir apenas administradores</option>
              <option>Permitir equipa editorial</option>
            </select>
          </label>

          <label class="grid gap-2">
            <span class="text-[12px] font-semibold text-[#616161]">Validação de conta</span>
            <select class="h-11 rounded-[6px] border border-[#E0E0E0] px-4 text-[14px] outline-none focus:border-[#8A3F50]">
              <option>Autenticação obrigatória</option>
              <option>Acesso apenas por convite</option>
            </select>
          </label>
        </div>
      </article>

      <article class="rounded-[8px] border border-[#E0E0E0] bg-white p-5 shadow-[0_18px_45px_rgba(27,22,30,0.05)]">
        <h2 class="text-[18px] font-extrabold text-[#5C1E2F]">Notificações</h2>
        <p class="mt-2 text-[12px] leading-5 text-[#616161]">Defina as preferências de alertas e relatórios de atividade.</p>

        <div class="mt-5 grid gap-3">
          <label class="flex items-center justify-between gap-3 rounded-[6px] border border-[#E0E0E0] bg-[#F5F5F5] px-4 py-3 text-[14px]">
            Alertas de sistema
            <input type="checkbox" checked class="accent-[#5C1E2F]" />
          </label>
          <label class="flex items-center justify-between gap-3 rounded-[6px] border border-[#E0E0E0] bg-[#F5F5F5] px-4 py-3 text-[14px]">
            Relatórios semanais
            <input type="checkbox" class="accent-[#5C1E2F]" />
          </label>
          <label class="flex items-center justify-between gap-3 rounded-[6px] border border-[#E0E0E0] bg-[#F5F5F5] px-4 py-3 text-[14px]">
            Atualizações de produto
            <input type="checkbox" checked class="accent-[#5C1E2F]" />
          </label>
        </div>
      </article>
    </div>
  </section>
</app-admin-console-shell>
