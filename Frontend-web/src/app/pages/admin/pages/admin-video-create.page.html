<app-admin-console-shell activeItem="contents">
  <main class="grid gap-6 xl:grid-cols-[minmax(0,1fr)_330px]">
    <section class="min-w-0">
     
      <form class="mt-6 grid gap-5" (submit)="$event.preventDefault()">
        <section class="rounded-[8px] border border-[#eadfe3] bg-white p-6 shadow-[0_18px_45px_rgba(27,22,30,0.05)]">
          <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
              <h2 class="flex items-center gap-3 font-display text-[24px] font-extrabold text-[#5c1e2f]">
                <span class="material-icon" aria-hidden="true">video_library</span>
                Fonte do conte&uacute;do
              </h2>
              <p class="mt-2 text-[13px] leading-6 text-[#6f686b]">Escolha entre uma URL externa ou um ficheiro enviado diretamente para a plataforma.</p>
            </div>
            <span class="rounded-[999px] bg-[#fff7df] px-3 py-1 text-[11px] font-extrabold uppercase text-[#735c00]">Rascunho</span>
          </div>

          <div class="mt-5 grid gap-4 md:grid-cols-2">
            <button
              type="button"
              class="min-h-[116px] rounded-[8px] border px-5 py-4 text-left transition"
              [class.border-[#5c1e2f]]="sourceMode() === 'url'"
              [class.bg-[#fff8fa]]="sourceMode() === 'url'"
              [class.border-[#eadfe3]]="sourceMode() !== 'url'"
              [class.bg-white]="sourceMode() !== 'url'"
              (click)="sourceMode.set('url')"
            >
              <span class="grid size-11 place-items-center rounded-[8px] bg-[#f7edef] text-[#8a1238]">
                <span class="material-icon" aria-hidden="true">link</span>
              </span>
              <strong class="mt-4 block text-[14px] font-extrabold text-[#5c1e2f]">URL externa</strong>
              <small class="mt-1 block text-[12px] text-[#8a8587]">YouTube ou Vimeo</small>
            </button>

            <button
              type="button"
              class="min-h-[116px] rounded-[8px] border px-5 py-4 text-left transition"
              [class.border-[#5c1e2f]]="sourceMode() === 'upload'"
              [class.bg-[#fff8fa]]="sourceMode() === 'upload'"
              [class.border-[#eadfe3]]="sourceMode() !== 'upload'"
              [class.bg-white]="sourceMode() !== 'upload'"
              (click)="sourceMode.set('upload')"
            >
              <span class="grid size-11 place-items-center rounded-[8px] bg-[#f7edef] text-[#8a1238]">
                <span class="material-icon" aria-hidden="true">upload_file</span>
              </span>
              <strong class="mt-4 block text-[14px] font-extrabold text-[#5c1e2f]">Upload direto</strong>
              <small class="mt-1 block text-[12px] text-[#8a8587]">MP4, MOV ate 2GB</small>
            </button>
          </div>

          @if (sourceMode() === 'url') {
            <label class="mt-5 grid gap-2">
              <span class="text-[13px] font-extrabold text-[#534345]">URL do video <b class="text-[#c43f58]">*</b></span>
              <input type="url" placeholder="https://vimeo.com/..." [value]="videoUrl()" (input)="setVideoUrl($event)" class="h-12 rounded-[8px] border border-[#ded8dd] bg-[#fbfaf7] px-4 text-[14px] text-[#2c2729] outline-none placeholder:text-[#9a949d] focus:border-[#5c1e2f] focus:shadow-[0_0_0_3px_rgba(227,212,216,0.65)]" />
            </label>
          } @else {
            <button type="button" (click)="uploadVideo()" class="mt-5 grid min-h-[150px] w-full place-items-center rounded-[8px] border border-dashed border-[#cfc7ce] bg-[#fbfaf7] text-center transition hover:border-[#5c1e2f] hover:bg-white">
              <span>
                <span class="mx-auto grid size-12 place-items-center rounded-[8px] bg-[#f7edef] text-[#8a1238]">
                  <span class="material-icon text-[30px]" aria-hidden="true">cloud_upload</span>
                </span>
                <strong class="mt-4 block text-[14px] font-extrabold text-[#5c1e2f]">{{ videoUploaded() ? 'Video carregado' : 'Carregar video MP4 ou MOV' }}</strong>
                <small class="mt-1 block text-[12px] text-[#8a8587]">{{ videoUploaded() ? 'Ficheiro pronto para revisao' : 'Arraste o ficheiro para aqui ou clique para procurar' }}</small>
              </span>
            </button>
          }
        </section>

        <section class="rounded-[8px] border border-[#eadfe3] bg-white p-6 shadow-[0_18px_45px_rgba(27,22,30,0.05)]">
          <h2 class="flex items-center gap-3 font-display text-[24px] font-extrabold text-[#5c1e2f]">
            <span class="material-icon" aria-hidden="true">article</span>
            Informa&ccedil;&otilde;es gerais
          </h2>

          <label class="mt-5 grid gap-2">
            <span class="text-[13px] font-extrabold text-[#534345]">Titulo da aula <b class="text-[#c43f58]">*</b></span>
            <input type="text" placeholder="Ex: A Economia Angolana no S&eacute;culo XVII" maxlength="120" [value]="title()" (input)="setTitle($event)" class="h-12 rounded-[8px] border border-[#ded8dd] bg-white px-4 text-[14px] text-[#2c2729] outline-none placeholder:text-[#9a949d] focus:border-[#5c1e2f] focus:shadow-[0_0_0_3px_rgba(227,212,216,0.65)]" />
            <span class="-mt-1 text-right text-[12px] text-[#89828b]">{{ title().length }}/120</span>
          </label>

          <div class="mt-4 grid gap-4 md:grid-cols-3">
            <label class="grid gap-2">
              <span class="text-[13px] font-extrabold text-[#534345]">Categoria</span>
              <select [value]="category()" (change)="setCategory($event)" class="h-11 rounded-[8px] border border-[#ded8dd] bg-white px-3 text-[13px] text-[#534345] outline-none focus:border-[#5c1e2f]">
                <option>Hist&oacute;ria Econ&oacute;mica</option>
                <option>Economia</option>
                <option>Hist&oacute;ria</option>
                <option>Textos com Jindungo</option>
              </select>
            </label>
            <label class="grid gap-2">
              <span class="text-[13px] font-extrabold text-[#534345]">Dura&ccedil;&atilde;o estimada</span>
              <input type="number" [value]="duration()" (input)="setDuration($event)" class="h-11 rounded-[8px] border border-[#ded8dd] bg-white px-3 text-[13px] text-[#534345] outline-none focus:border-[#5c1e2f]" />
            </label>
            <label class="grid gap-2">
              <span class="text-[13px] font-extrabold text-[#534345]">Unidade</span>
              <select class="h-11 rounded-[8px] border border-[#ded8dd] bg-white px-3 text-[13px] text-[#534345] outline-none focus:border-[#5c1e2f]">
                <option>Minutos</option>
                <option>Horas</option>
              </select>
            </label>
          </div>

          <label class="mt-4 grid gap-2">
            <span class="text-[13px] font-extrabold text-[#534345]">Resumo para alunos</span>
            <textarea
              placeholder="Descreva os principais pontos que ser&atilde;o abordados nesta aula..."
              maxlength="500"
              [value]="summary()"
              (input)="setSummary($event)"
              class="min-h-[132px] resize-y rounded-[8px] border border-[#ded8dd] bg-[#fbfaf7] px-4 py-3 text-[14px] leading-6 text-[#2c2729] outline-none placeholder:text-[#9a949d] focus:border-[#5c1e2f] focus:shadow-[0_0_0_3px_rgba(227,212,216,0.65)]"
            ></textarea>
            <span class="-mt-1 text-right text-[12px] text-[#89828b]">{{ summary().length }}/500</span>
          </label>
        </section>
      </form>
    </section>

    <aside class="grid content-start gap-5">
      <section class="rounded-[8px] border border-[#eadfe3] bg-white p-5 shadow-[0_18px_45px_rgba(27,22,30,0.05)]">
        <h2 class="font-display text-[18px] font-extrabold text-[#5c1e2f]">Pre-visualiza&ccedil;&atilde;o</h2>
        <div class="mt-4 overflow-hidden rounded-[8px] border border-[#eadfe3] bg-[#2b2524]">
          <div class="grid aspect-video place-items-center bg-[linear-gradient(135deg,#4a1b29,#1f2020)]">
            <button type="button" class="grid size-14 place-items-center rounded-full border-2 border-white/80 bg-white/10 text-white" aria-label="Reproduzir pre-visualizacao">
              <span class="material-icon text-[34px]" aria-hidden="true">play_arrow</span>
            </button>
          </div>
          <div class="bg-[#342b2b] px-4 py-3">
            <div class="h-2 overflow-hidden rounded-full bg-white/20">
              <span class="block h-full w-[35%] rounded-full bg-[#d4af37]"></span>
            </div>
          </div>
        </div>
        <div class="mt-4 grid gap-2">
          <p class="text-[13px] font-extrabold text-[#5c1e2f]">{{ previewTitle() }}</p>
          <p class="text-[12px] leading-5 text-[#6f686b]">{{ previewSummary() }}</p>
          <span class="h-3 w-[68%] rounded-full bg-[#f0edef]"></span>
        </div>
      </section>

      <section class="grid gap-3">
        <button type="button" (click)="publish()" class="inline-flex h-12 items-center justify-center gap-3 rounded-[8px] bg-[#5c1e2f] px-4 text-[14px] font-extrabold text-white shadow-[0_12px_24px_rgba(92,30,47,0.2)]">
          <span class="material-icon" aria-hidden="true">publish</span>
          Publicar video
        </button>
        <button type="button" (click)="saveDraft()" class="inline-flex h-12 items-center justify-center gap-3 rounded-[8px] border border-[#5c1e2f] bg-white px-4 text-[14px] font-extrabold text-[#5c1e2f]">
          <span class="material-icon" aria-hidden="true">save</span>
          Guardar rascunho
        </button>
      </section>
    </aside>
  </main>
</app-admin-console-shell>
