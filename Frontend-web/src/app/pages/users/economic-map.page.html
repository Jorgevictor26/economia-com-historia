<section class="-m-6 h-dvh overflow-hidden bg-[#F7F7F7] text-[#212121]">
  <app-public-navbar />

  <main class="grid h-[calc(100dvh-70px)] overflow-hidden bg-[#F7F7F7] lg:grid-cols-[292px_minmax(0,1fr)] xl:grid-cols-[292px_minmax(0,1fr)_460px]">
    <app-economic-map-sidebar
      [searchTerm]="searchTerm()"
      [searchResults]="searchResults()"
      [layers]="layers"
      [activeLayer]="activeLayer()"
      [quickFilters]="quickFilters"
      [detailLabel]="detailLabel()"
      [detailZoom]="detailStep().toFixed(1) + 'x'"
      [detailProgress]="detailProgress()"
      (searchTermChange)="setSearchTerm($event)"
      (layerSelected)="selectLayer($event)"
      (regionSelected)="selectRegion($event)"
      (reset)="resetMap()"
      (zoomIn)="zoomIn()"
      (zoomOut)="zoomOut()"
    />

    <section class="relative min-h-0 border-l border-[#E0E0E0] bg-white px-6 py-5">
      <app-economic-map-leaflet
        class="block h-full min-h-0"
        [selectedRegionId]="selectedRegionId()"
        [activeLayer]="activeLayer()"
        (regionSelected)="selectRegion($event)"
        (reset)="resetMap()"
      />

      <div class="pointer-events-none absolute bottom-8 left-9 z-[410]">
        <nav class="pointer-events-auto inline-flex items-center gap-2 rounded-[8px] border border-[#E0E0E0] bg-white px-5 py-4 text-[13px] shadow-[0_14px_34px_rgba(33,33,33,0.12)]" aria-label="Localização no mapa">
          @for (item of breadcrumb(); track item.id) {
            <button type="button" class="font-bold transition hover:text-[#5C1E2F]" [class.text-[#5C1E2F]]="$last" [class.text-[#616161]]="!$last" (click)="selectRegion(item.id)">
              {{ item.label }}
            </button>
            @if (!$last) {
              <span class="material-symbols-outlined text-[16px] text-[#9E9E9E]" aria-hidden="true">chevron_right</span>
            }
          }
        </nav>
      </div>
    </section>

    @if (panelOpen()) {
      <section class="min-h-0 border-l border-[#E0E0E0] bg-white p-6">
        <app-economic-map-info-panel
          [region]="selectedRegion()"
          [activeTab]="activeTab()"
          [childCount]="children().length"
          (tabSelected)="setActiveTab($event)"
          (closed)="closePanel()"
          (exploreChildren)="exploreChildren()"
        />
      </section>
    }
  </main>

  <app-back-to-top />
</section>
