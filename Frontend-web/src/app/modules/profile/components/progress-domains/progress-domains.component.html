<div class="domains-grid">
  @for (domain of domains(); track domain.title) {
    <article class="domain-card" [style.--accent]="domain.color" [style.--value]="domain.percent">
      <h3>{{ domain.title }}</h3>
      <div class="ring" [style.background]="'conic-gradient(' + domain.color + ' ' + domain.percent + '%, #eee9eb 0)'">
        <span>{{ domain.percent }}%</span>
      </div>
      <ul>
        <li><span></span>{{ domain.completedTopics }} tópicos concluídos</li>
        <li><span></span>{{ domain.pendingTopics }} tópicos pendentes</li>
      </ul>
    </article>
  }
</div>
